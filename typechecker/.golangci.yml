version: "2"

linters:
  enable:
    - gocyclo
    - gocognit
    - funlen
    - dupl
    - nestif
    - maintidx
    - gocritic
    - unparam
    - unconvert
    - errcheck
    - staticcheck

  settings:
    gocyclo:
      # bumped from default 10/15 — type-switch dispatch over AST nodes
      # inflates this metric without adding real cognitive load
      min-complexity: 25

    gocognit:
      # cognitive complexity still matters more than cyclomatic here;
      # keep this tighter than gocyclo since nested boolean logic in
      # constraint solving/unification IS genuinely harder to follow
      min-complexity: 20

    funlen:
      # AST walkers and type inference functions tend to run long
      # even when well-factored, due to exhaustive case handling
      lines: 120
      statements: 70

    dupl:
      # type-switch arms across different node types often look
      # structurally similar (same shape, different field access) —
      # raise threshold to avoid flagging legitimate parallelism
      threshold: 200

    nestif:
      min-complexity: 6

    maintidx:
      # maintainability index; default 20 is often too strict for
      # dispatch-heavy code — this is the metric most likely to need
      # per-function nolint if it's still noisy
      under: 15

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain  # type switches sometimes decompose into this; not worth fighting

  exclusions:
    rules:
      # test files: complexity in table-driven tests is expected noise
      - path: '_test\.go'
        linters:
          - gocyclo
          - gocognit
          - funlen
          - dupl
      # test files: copy cost of value params in pbt generators is irrelevant
      - path: '_test\.go'
        text: 'hugeParam'
        linters:
          - gocritic

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
